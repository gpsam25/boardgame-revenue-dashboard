<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法少女育成計畫：哈莉·波特</title>
<style>
/* ============================================================
   魔法少女育成計畫：哈莉·波特 — 美少女夢工廠式養成遊戲
   單一視覺主題：城堡深綠 × 羊皮紙 × 古金（復古 90 年代養成遊戲 UI）
   ============================================================ */
:root{
  --ground:#0e1613;        /* 城堡石牆深綠黑 */
  --ground-2:#152019;
  --parch:#f1e3c2;         /* 羊皮紙 */
  --parch-2:#e6d3a8;
  --ink:#3a2c1c;           /* 墨棕 */
  --ink-soft:#6b5638;
  --gold:#c9a227;          /* 古金 */
  --gold-2:#8a6d1c;
  --dlg:#101d17;           /* 對話框深綠 */
  --dlg-text:#f4ead2;
  --accent:#2f7d52;        /* 史萊哲林綠（石內卜） */
  --bad:#9b2c23;
  --good:#2f7d52;
  --house:#7f0909;         /* 依分類學院動態改寫 */
  --house-2:#d4a017;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #1d2c23 0%, transparent 60%),
    radial-gradient(900px 500px at 85% 110%, #18251d 0%, transparent 55%),
    var(--ground);
  color:var(--dlg-text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:14px;
}
button{font-family:inherit;cursor:pointer;}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

#game{
  width:100%;max-width:1020px;
  border:3px solid var(--gold-2);
  outline:1px solid #000;
  box-shadow:0 0 0 6px #0a100d,0 18px 60px rgba(0,0,0,.6);
  background:linear-gradient(180deg,var(--ground-2),var(--ground));
  border-radius:6px;overflow:hidden;position:relative;
}

/* ---------- 通用羊皮紙面板 ---------- */
.panel{
  background:
    repeating-linear-gradient(0deg, rgba(120,90,40,.04) 0 2px, transparent 2px 4px),
    linear-gradient(160deg,var(--parch) 0%,var(--parch-2) 100%);
  color:var(--ink);
  border:2px solid var(--gold-2);
  box-shadow:inset 0 0 0 2px rgba(255,244,214,.55), inset 0 0 26px rgba(122,89,38,.25);
  border-radius:5px;
}
.panel-title{
  font-family:"Noto Serif TC","Songti TC",serif;
  font-weight:700;letter-spacing:.35em;text-indent:.35em;
  text-align:center;color:var(--gold-2);
  border-bottom:1px solid rgba(138,109,28,.45);
  padding:6px 0;margin-bottom:8px;font-size:14px;
}

/* ---------- 標題畫面 ---------- */
#screen-title{padding:46px 24px 40px;text-align:center;position:relative;min-height:560px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#screen-title .stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
#screen-title .stars span{position:absolute;color:var(--gold);opacity:.6;animation:tw 3s ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:.8;transform:scale(1.1);}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
.title-eyebrow{letter-spacing:.6em;text-indent:.6em;color:var(--gold);font-size:13px;}
.title-main{
  font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;
  font-size:clamp(30px,5.4vw,52px);line-height:1.25;text-wrap:balance;
  color:var(--parch);text-shadow:0 2px 0 #000,0 0 26px rgba(201,162,39,.35);
}
.title-main em{font-style:normal;color:var(--gold);}
.title-sub{color:#bcae8d;font-size:14px;letter-spacing:.2em;text-indent:.2em;}
.title-frame{width:min(420px,80%);height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:6px auto;}
.btn{
  background:linear-gradient(180deg,#20362a,#152218);
  color:var(--parch);border:2px solid var(--gold-2);
  padding:11px 34px;font-size:16px;letter-spacing:.3em;text-indent:.3em;
  border-radius:4px;box-shadow:0 3px 0 #000;
  transition:transform .08s ease, box-shadow .08s ease, background .15s ease;
}
.btn:hover{background:linear-gradient(180deg,#2a4736,#1b2c20);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000;}
.btn.gold{background:linear-gradient(180deg,#c9a227,#8a6d1c);color:#20180a;font-weight:700;}
.btn.gold:hover{background:linear-gradient(180deg,#dcb838,#9c7d22);}
.btn.small{padding:7px 16px;font-size:13px;letter-spacing:.15em;text-indent:.15em;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- 主畫面 ---------- */
#screen-main{display:none;padding:12px;gap:12px;}
#screen-main.active{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;}
@media (max-width:760px){ #screen-main.active{grid-template-columns:1fr;} }

.topbar{
  grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:linear-gradient(180deg,#1b2a21,#121d16);
  border:2px solid var(--gold-2);border-radius:5px;padding:8px 12px;
}
.topbar .date{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;color:var(--gold);letter-spacing:.1em;}
.topbar .chip{
  background:#0d1712;border:1px solid var(--gold-2);border-radius:3px;
  padding:3px 10px;font-size:13px;color:var(--parch);
  font-variant-numeric:tabular-nums;
}
.topbar .chip b{color:var(--gold);font-weight:600;}
.topbar .spacer{flex:1;}

.portrait-card{padding:10px;display:flex;flex-direction:column;gap:8px;}
.portrait-frame{
  border:3px double var(--gold-2);border-radius:4px;
  background:
    radial-gradient(320px 260px at 50% 30%, #24382c 0%, #101b14 75%),
    #101b14;
  position:relative;overflow:hidden;aspect-ratio:5/6;
}
.portrait-frame svg{width:100%;height:100%;display:block;}
.portrait-frame .corner{position:absolute;width:16px;height:16px;border:2px solid var(--gold);}
.corner.tl{top:4px;left:4px;border-right:0;border-bottom:0;}
.corner.tr{top:4px;right:4px;border-left:0;border-bottom:0;}
.corner.bl{bottom:4px;left:4px;border-right:0;border-top:0;}
.corner.br{bottom:4px;right:4px;border-left:0;border-top:0;}
.portrait-name{
  text-align:center;font-family:"Noto Serif TC",serif;font-weight:700;
  color:var(--ink);letter-spacing:.2em;text-indent:.2em;
}
.portrait-house{
  text-align:center;font-size:12px;color:#fff;
  background:linear-gradient(90deg,var(--house),var(--house) 60%,var(--house-2));
  border-radius:3px;padding:3px 0;letter-spacing:.3em;text-indent:.3em;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}

.stats-card{padding:10px 12px;display:flex;flex-direction:column;}
.stat-row{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;padding:4px 0;}
.stat-name{font-size:13px;color:var(--ink);letter-spacing:.15em;}
.stat-bar{height:12px;background:#d9c294;border:1px solid var(--gold-2);border-radius:2px;overflow:hidden;position:relative;}
.stat-fill{height:100%;background:linear-gradient(90deg,#5f8f4e,#8fae3f);transition:width .5s ease;}
.stat-fill.f-magic{background:linear-gradient(90deg,#4b5fa8,#7d8fd6);}
.stat-fill.f-knowledge{background:linear-gradient(90deg,#8a6d1c,#c9a227);}
.stat-fill.f-fitness{background:linear-gradient(90deg,#a8642a,#d9974a);}
.stat-fill.f-charm{background:linear-gradient(90deg,#a84b74,#d67da4);}
.stat-fill.f-courage{background:linear-gradient(90deg,#9b2c23,#d0583a);}
.stat-fill.f-dark{background:linear-gradient(90deg,#3a2b52,#6b4d9e);}
.stat-fill.f-stress{background:linear-gradient(90deg,#6c6f2a,#b0b23c);}
.stat-fill.f-snape{background:linear-gradient(90deg,#1f5d3e,#2f7d52);}
.stat-val{font-size:13px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;}
.main-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap;}
.main-actions .btn{flex:1;min-width:120px;}

/* ---------- 行程安排 ---------- */
#screen-schedule{display:none;padding:12px;flex-direction:column;gap:10px;}
#screen-schedule.active{display:flex;}
.slots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;}
.slot{
  flex:1;min-width:140px;text-align:center;padding:9px 6px;border:2px dashed var(--gold-2);
  border-radius:4px;color:var(--ink-soft);font-size:14px;background:rgba(255,248,226,.35);
}
.slot.filled{border-style:solid;color:var(--ink);font-weight:700;background:#fff6de;}
.slot small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px;letter-spacing:.2em;}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:10px 12px;}
.act{
  text-align:left;background:#fff6de;border:2px solid var(--gold-2);border-radius:4px;
  padding:8px 10px;color:var(--ink);transition:transform .07s ease,background .15s ease;
}
.act:hover{background:#ffeec4;transform:translateY(-1px);}
.act:disabled{opacity:.4;transform:none;}
.act .a-name{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:baseline;}
.act .a-cost{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.act .a-cost.earn{color:var(--good);font-weight:700;}
.act .a-cost.pay{color:var(--bad);}
.act .a-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
.sched-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 2px 2px;}

/* ---------- 月結算 ---------- */
#screen-run{display:none;padding:12px;flex-direction:column;gap:10px;}
#screen-run.active{display:flex;}
.run-list{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:260px;}
.run-item{opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;}
.run-item.show{opacity:1;transform:none;}
.run-item .r-head{font-family:"Noto Serif TC",serif;font-weight:700;color:var(--ink);letter-spacing:.1em;}
.run-item .r-head small{color:var(--ink-soft);font-weight:400;letter-spacing:.2em;margin-right:6px;}
.run-item .r-gains{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.gain{
  font-size:12px;padding:2px 8px;border-radius:3px;border:1px solid var(--gold-2);
  background:#fff6de;color:var(--ink);font-variant-numeric:tabular-nums;
}
.gain.up{color:var(--good);font-weight:700;}
.gain.down{color:var(--bad);font-weight:700;}
.run-foot{display:flex;justify-content:flex-end;}

/* ---------- 對話框 ---------- */
#dialog{
  display:none;position:absolute;left:0;right:0;bottom:0;z-index:40;
  padding:10px;
}
#dialog.active{display:block;}
.dlg-box{
  background:linear-gradient(180deg,rgba(16,29,23,.97),rgba(10,19,14,.97));
  border:2px solid var(--gold);border-radius:6px;
  box-shadow:0 -8px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.6);
  padding:12px 14px 12px;display:grid;grid-template-columns:96px 1fr;gap:12px;min-height:132px;
}
.dlg-face{
  width:96px;height:96px;border:2px solid var(--gold-2);border-radius:4px;
  background:radial-gradient(70px 60px at 50% 35%, #22392c, #0d1712);overflow:hidden;
  align-self:start;
}
.dlg-face svg{width:100%;height:100%;display:block;}
.dlg-face.none{visibility:hidden;}
.dlg-body{display:flex;flex-direction:column;min-width:0;}
.dlg-name{
  color:var(--gold);font-weight:700;letter-spacing:.25em;font-size:13px;margin-bottom:4px;
  font-family:"Noto Serif TC",serif;
}
.dlg-text{color:var(--dlg-text);line-height:1.8;font-size:15px;flex:1;white-space:pre-wrap;}
.dlg-next{align-self:flex-end;color:var(--gold);font-size:12px;animation:bob 1s ease-in-out infinite;user-select:none;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
.dlg-choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.dlg-choices .btn{letter-spacing:.1em;text-indent:.1em;padding:8px 18px;font-size:14px;}

/* ---------- 結局 ---------- */
#screen-ending{display:none;padding:20px;flex-direction:column;gap:14px;align-items:center;}
#screen-ending.active{display:flex;}
.end-card{width:min(680px,100%);padding:20px 24px;text-align:center;}
.end-title{
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(24px,4vw,34px);
  color:var(--gold-2);letter-spacing:.2em;text-indent:.2em;margin:6px 0 10px;text-wrap:balance;
}
.end-eyebrow{font-size:12px;letter-spacing:.5em;text-indent:.5em;color:var(--ink-soft);}
.end-desc{color:var(--ink);line-height:2;text-align:left;margin:8px 0;}
.end-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:12px;}
.end-stat{background:#fff6de;border:1px solid var(--gold-2);border-radius:3px;padding:6px 4px;font-size:13px;color:var(--ink);}
.end-stat b{display:block;font-size:17px;color:var(--gold-2);font-variant-numeric:tabular-nums;}
.end-portrait{width:min(300px,70%);}
.end-portrait .portrait-frame{aspect-ratio:5/6;}

/* ---------- 浮動訊息 ---------- */
#toast{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(16,29,23,.95);border:1px solid var(--gold);color:var(--parch);
  padding:8px 18px;border-radius:4px;font-size:14px;display:none;letter-spacing:.1em;
}
</style>
</head>
<body>
<div id="game" aria-live="polite">

  <!-- ======= 標題畫面 ======= -->
  <section id="screen-title">
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="title-eyebrow">◆ 美少女夢工廠式 養成遊戲 ◆</div>
    <h1 class="title-main">魔法少女育成計畫<br><em>哈莉·波特</em></h1>
    <div class="title-frame"></div>
    <p class="title-sub">魔藥學教授 賽佛勒斯·石內卜，<br>將撫養「活下來的女孩」直到十八歲成年——</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;">
      <button class="btn gold" id="btn-new">開始育成</button>
      <button class="btn" id="btn-continue" style="display:none;">繼續遊戲</button>
    </div>
    <p class="title-sub" style="font-size:12px;opacity:.7;margin-top:8px;">非官方粉絲創作 · 僅供娛樂</p>
  </section>

  <!-- ======= 主畫面 ======= -->
  <section id="screen-main">
    <div class="topbar">
      <span class="date" id="ui-date">1991年9月</span>
      <span class="chip">第 <b id="ui-schoolyear">1</b> 學年</span>
      <span class="chip">年齡 <b id="ui-age">11</b> 歲</span>
      <span class="spacer"></span>
      <span class="chip">💰 <b id="ui-money">80</b> 加隆</span>
    </div>

    <div class="panel portrait-card">
      <div class="portrait-frame" id="ui-portrait">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
      </div>
      <div class="portrait-name">哈莉·波特</div>
      <div class="portrait-house" id="ui-house">尚未分類</div>
    </div>

    <div class="panel stats-card">
      <div class="panel-title">能 力</div>
      <div id="ui-stats"></div>
      <div class="main-actions">
        <button class="btn gold" id="btn-schedule">安排行程</button>
        <button class="btn small" id="btn-talk">找教授談話</button>
        <button class="btn small" id="btn-save">記錄日誌</button>
      </div>
    </div>
  </section>

  <!-- ======= 行程安排 ======= -->
  <section id="screen-schedule">
    <div class="panel">
      <div class="panel-title" style="margin-bottom:0;">本 月 行 程（三旬）</div>
      <div class="slots">
        <div class="slot" id="slot-0"><small>上旬</small>—</div>
        <div class="slot" id="slot-1"><small>中旬</small>—</div>
        <div class="slot" id="slot-2"><small>下旬</small>—</div>
      </div>
    </div>
    <div class="panel" style="flex:1;overflow:auto;">
      <div class="panel-title" style="margin-bottom:0;">選 擇 活 動</div>
      <div class="acts" id="ui-acts"></div>
    </div>
    <div class="sched-foot">
      <button class="btn small" id="btn-sched-clear">重新安排</button>
      <button class="btn small" id="btn-sched-back">返回</button>
      <button class="btn gold small" id="btn-sched-go" disabled>開始這個月</button>
    </div>
  </section>

  <!-- ======= 月結算 ======= -->
  <section id="screen-run">
    <div class="panel" style="flex:1;">
      <div class="panel-title" id="run-title">月結算</div>
      <div class="run-list" id="run-list"></div>
    </div>
    <div class="run-foot">
      <button class="btn gold small" id="btn-run-next" style="visibility:hidden;">繼續 ▼</button>
    </div>
  </section>

  <!-- ======= 結局 ======= -->
  <section id="screen-ending">
    <div class="end-portrait"><div class="portrait-frame" id="end-portrait"></div></div>
    <div class="panel end-card">
      <div class="end-eyebrow">─ ENDING ─</div>
      <div class="end-title" id="end-title"></div>
      <div class="end-desc" id="end-desc"></div>
      <div class="end-stats" id="end-stats"></div>
    </div>
    <button class="btn gold" id="btn-restart">再次育成</button>
  </section>

  <!-- ======= 對話框 ======= -->
  <div id="dialog">
    <div class="dlg-box">
      <div class="dlg-face" id="dlg-face"></div>
      <div class="dlg-body">
        <div class="dlg-name" id="dlg-name"></div>
        <div class="dlg-text" id="dlg-text"></div>
        <div class="dlg-choices" id="dlg-choices"></div>
        <div class="dlg-next" id="dlg-next">▼ 點擊繼續</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
"use strict";
/* ============================================================
   基本工具
============================================================ */
const $ = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const SAVE_KEY = "hally-raising-v1";

/* ============================================================
   遊戲狀態
============================================================ */
const STAT_DEFS = [
  {key:"magic",     name:"魔　力", cls:"f-magic"},
  {key:"knowledge", name:"知　識", cls:"f-knowledge"},
  {key:"fitness",   name:"體　能", cls:"f-fitness"},
  {key:"charm",     name:"魅　力", cls:"f-charm"},
  {key:"courage",   name:"勇　氣", cls:"f-courage"},
  {key:"dark",      name:"黑暗傾向", cls:"f-dark"},
  {key:"stress",    name:"壓　力", cls:"f-stress"},
  {key:"snape",     name:"教授好感", cls:"f-snape"},
];
const STAT_MAX = {magic:999,knowledge:999,fitness:999,charm:999,courage:999,dark:999,stress:120,snape:500};
const STAT_NAME = Object.fromEntries(STAT_DEFS.map(d=>[d.key,d.name.replace(/　/g,"")]));
STAT_NAME.money = "加隆";

const HOUSES = {
  gryffindor:{name:"葛來分多", c1:"#7f0909", c2:"#d4a017", bonus:{courage:25}},
  slytherin: {name:"史萊哲林", c1:"#0f3d29", c2:"#b9c4c9", bonus:{magic:15,dark:5,snape:15}},
  ravenclaw: {name:"雷文克勞", c1:"#1d3a6e", c2:"#8a5a2b", bonus:{knowledge:25}},
  hufflepuff:{name:"赫夫帕夫", c1:"#a8860b", c2:"#2f2b28", bonus:{fitness:12,charm:12}},
};

let S = null;
function newState(){
  return {
    house:null,
    monthIndex:0,           // 0 = 1991年9月，83 = 1998年8月
    stats:{magic:30,knowledge:30,fitness:30,charm:25,courage:35,dark:5,stress:10,snape:20},
    money:80,
    flags:{sorted:false,quidditch:false,sickPending:false,metHermione:false,wandDream:false},
    onceEvents:[],
    schedule:[],
  };
}
function dateOf(i){
  const m0 = 8 + i;               // 0-based month since 1991-01
  const year = 1991 + Math.floor(m0/12);
  const month = (m0%12)+1;
  return {year,month};
}
function ageOf(){
  const {year,month} = dateOf(S.monthIndex);
  return (year-1980) - (month<8?1:0);   // 生日 7/31
}
function schoolYearOf(){
  return clamp(Math.floor(S.monthIndex/12)+1,1,7);
}
function stageOf(){
  const a = ageOf();
  return a<13?1:(a<16?2:3);
}

/* ============================================================
   立繪（SVG · 動漫風）

/* ============================================================
   對話引擎（打字機 + 選項）
============================================================ */
const dlg = {queue:[], typing:false, timer:null, onDone:null, cur:null};

function say(items, onDone){
  dlg.queue = items.slice();
  dlg.onDone = onDone || null;
  $("dialog").classList.add("active");
  dlgNext();
}
function dlgNext(){
  if(dlg.typing){ // 快轉
    clearInterval(dlg.timer); dlg.typing = false;
    $("dlg-text").textContent = dlg.cur.text;
    if(dlg.cur.choices) showChoices(dlg.cur.choices);
    else $("dlg-next").style.visibility = "visible";
    return;
  }
  if(dlg.cur && dlg.cur.choices) return; // 等待選項
  const item = dlg.queue.shift();
  if(!item){
    $("dialog").classList.remove("active");
    dlg.cur = null;
    const cb = dlg.onDone; dlg.onDone = null;
    if(cb) cb();
    return;
  }
  dlg.cur = item;
  const who = item.who || "narr";
  const faceKey = (item.face !== undefined) ? item.face : (FACES[who] ? who : "none");
  const face = $("dlg-face");
  if(faceKey && faceKey!=="none" && FACES[faceKey]){
    face.classList.remove("none"); face.innerHTML = FACES[faceKey]();
  } else { face.classList.add("none"); face.innerHTML = ""; }
  $("dlg-name").textContent = item.name || SPEAKER[who] || "";
  $("dlg-choices").innerHTML = "";
  $("dlg-next").style.visibility = "hidden";
  const textEl = $("dlg-text");
  textEl.textContent = "";
  let i = 0; dlg.typing = true;
  dlg.timer = setInterval(()=>{
    textEl.textContent = item.text.slice(0, ++i);
    if(i >= item.text.length){
      clearInterval(dlg.timer); dlg.typing = false;
      if(item.choices) showChoices(item.choices);
      else $("dlg-next").style.visibility = "visible";
    }
  }, 26);
}
function showChoices(choices){
  const box = $("dlg-choices");
  box.innerHTML = "";
  choices.forEach(c=>{
    const b = document.createElement("button");
    b.className = "btn small"; b.textContent = c.label;
    b.onclick = (e)=>{
      e.stopPropagation();
      dlg.cur = null; box.innerHTML = "";
      if(c.house){ S.house = c.house; refreshUI(); }
      if(c.then) dlg.queue = c.then.concat(dlg.queue);
      if(c.effect) applyGains(c.effect, true);
      dlgNext();
    };
    box.appendChild(b);
  });
}
$("dialog").addEventListener("click", dlgNext);
document.addEventListener("keydown", e=>{
  if((e.key===" "||e.key==="Enter") && $("dialog").classList.contains("active")){
    e.preventDefault(); dlgNext();
  }
});

/* ============================================================
   數值處理
============================================================ */
function applyGains(g, toast){
  const parts = [];
  for(const k in g){
    const v = g[k];
    if(k === "money"){ S.money = Math.max(0, S.money + v); }
    else if(k in S.stats){ S.stats[k] = clamp(S.stats[k] + v, 0, STAT_MAX[k]); }
    else continue;
    parts.push(`${STAT_NAME[k]}${v>0?"+":""}${v}`);
  }
  refreshUI();
  if(toast && parts.length) showToast(parts.join("　"));
}
let toastTimer = null;
function showToast(msg){
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display = "none"; }, 2200);
}

/* ============================================================
   畫面切換 / UI 更新
============================================================ */
function showScreen(id){
  ["screen-title","screen-main","screen-schedule","screen-run","screen-ending"]
    .forEach(s => $(s).classList.toggle("active", s===id));
  $("screen-title").style.display = (id==="screen-title") ? "flex" : "none";
}
function refreshUI(){
  if(!S) return;
  const {year,month} = dateOf(S.monthIndex);
  $("ui-date").textContent = `${year}年${month}月`;
  $("ui-age").textContent = ageOf();
  $("ui-schoolyear").textContent = schoolYearOf();
  $("ui-money").textContent = S.money;
  const h = HOUSES[S.house];
  $("ui-house").textContent = h ? h.name : "尚未分類";
  if(h){
    document.documentElement.style.setProperty("--house", h.c1);
    document.documentElement.style.setProperty("--house-2", h.c2);
  }
  // 立繪
  const pf = $("ui-portrait");
  pf.querySelectorAll("svg").forEach(x=>x.remove());
  pf.insertAdjacentHTML("beforeend", hallySVG(stageOf(), S.house || "gryffindor"));
  // 能力條
  const box = $("ui-stats");
  box.innerHTML = "";
  STAT_DEFS.forEach(d=>{
    const v = S.stats[d.key], max = STAT_MAX[d.key];
    // 999 上限的成長型能力用平方根曲線，前期的成長在條上看得見
    const ratio = max>=999 ? Math.sqrt(v/max) : v/max;
    box.insertAdjacentHTML("beforeend", `
      <div class="stat-row">
        <span class="stat-name">${d.name}</span>
        <div class="stat-bar"><div class="stat-fill ${d.cls}" style="width:${clamp(ratio*100,0,100)}%"></div></div>
        <span class="stat-val">${v}</span>
      </div>`);
  });
}

function openSchedule(){
  if(S.flags.sickPending){
    // 生病強制休養
    say([
      {who:"narr", text:"哈莉發著高燒躺在醫療翼。這個月，只能靜養了。"},
      {who:"snape", text:"……我早就警告過你。喝下去，別吐出來。\n（他默默放下一瓶自己熬的退燒魔藥，坐在床邊批改考卷到深夜。）"},
    ], ()=>{
      S.flags.sickPending = false;
      applyGains({stress:-60, fitness:-4, snape:6}, true);
      endOfMonth([]);
    });
    return;
  }
  S.schedule = [];
  renderSchedule();
  showScreen("screen-schedule");
}
function scheduledCost(){
  return S.schedule.reduce((t,id)=>t + Math.max(0, ACT_BY_ID[id].cost), 0);
}
function renderSchedule(){
  for(let i=0;i<3;i++){
    const el = $("slot-"+i);
    const id = S.schedule[i];
    el.className = "slot" + (id ? " filled" : "");
    el.innerHTML = `<small>${["上旬","中旬","下旬"][i]}</small>${id ? ACT_BY_ID[id].name : "—"}`;
  }
  const box = $("ui-acts");
  box.innerHTML = "";
  ACTIVITIES.forEach(a=>{
    const full = S.schedule.length >= 3;
    const cantAfford = a.cost > 0 && (scheduledCost() + a.cost) > S.money;
    const b = document.createElement("button");
    b.className = "act";
    b.disabled = full || cantAfford;
    const costTxt = a.cost > 0 ? `−${a.cost}G` : a.cost < 0 ? `＋${-a.cost}G` : "免費";
    const costCls = a.cost > 0 ? "pay" : a.cost < 0 ? "earn" : "";
    b.innerHTML = `<div class="a-name">${a.name}<span class="a-cost ${costCls}">${costTxt}</span></div>
                   <div class="a-desc">${a.desc}</div>`;
    b.onclick = ()=>{ S.schedule.push(a.id); renderSchedule(); };
    box.appendChild(b);
  });
  $("btn-sched-go").disabled = S.schedule.length < 3;
}

   月執行
============================================================ */
function runMonth(){
  showScreen("screen-run");
  const {year,month} = dateOf(S.monthIndex);
  $("run-title").textContent = `${year}年${month}月　結算`;
  const list = $("run-list");
  list.innerHTML = "";
  $("btn-run-next").style.visibility = "hidden";

  const results = [];
  const stage = stageOf();
  const growthMul = stage===1 ? 1 : stage===2 ? 1.1 : 1.2;

  S.schedule.forEach((id)=>{
    const a = ACT_BY_ID[id];
    const delta = {};
    for(const k in a.gains){
      let v = a.gains[k];
      if(v > 0 && k !== "stress" && k !== "dark"){
        v = Math.round(v * growthMul * (0.75 + Math.random()*0.5));
      } else if(v > 0){
        v = Math.round(v * (0.8 + Math.random()*0.4));
      }
      delta[k] = v;
    }
    if(a.cost) delta.money = -a.cost;
    results.push({act:a, delta});
  });

  // 逐旬套用 + 顯示
  results.forEach((r,i)=>{
    applyGains(r.delta, false);
    const gains = Object.entries(r.delta).map(([k,v])=>{
      const cls = (k==="stress"||k==="dark") ? (v>0?"down":"up")
                : (k==="money") ? (v>0?"up":"down")
                : (v>=0?"up":"down");
      return `<span class="gain ${cls}">${STAT_NAME[k]} ${v>0?"+":""}${v}</span>`;
    }).join("");
    const el = document.createElement("div");
    el.className = "run-item";
    el.innerHTML = `<div class="r-head"><small>${["上旬","中旬","下旬"][i]}</small>${r.act.name}</div>
                    <div class="r-gains">${gains}</div>`;
    list.appendChild(el);
    setTimeout(()=>el.classList.add("show"), 350 + i*650);
  });
  setTimeout(()=>{
    refreshUI();
    $("btn-run-next").style.visibility = "visible";
  }, 350 + results.length*650 + 250);

  $("btn-run-next").onclick = ()=> endOfMonth(results.map(r=>r.act.id));
}

/* ============================================================
   月末事件
============================================================ */
function endOfMonth(actIds){
  showScreen("screen-main");
  refreshUI();
  const chain = [];

  // 風險活動事件
  if(actIds.includes("forest") && Math.random() < 0.25) chain.push(evForestInjury);
  if(actIds.includes("restrict") && Math.random() < 0.3) chain.push(evCaughtRestricted);

  // 固定月事件
  const {month} = dateOf(S.monthIndex);
  if(month === 6) chain.push(evExam);
  if(month === 12) chain.push(evChristmas);
  if(month === 7) chain.push(evBirthday);

  // 隨機事件
  if(chain.length === 0 || Math.random() < 0.35){
    const ev = pickRandomEvent();
    if(ev) chain.push(ev);
  }

  // 壓力病倒判定（下月生效）
  if(S.stats.stress >= 100){
    chain.push(next=>{
      S.flags.sickPending = true;
      say([
        {who:"narr", text:"連日的疲憊累積，哈莉的臉色越來越差……"},
        {who:"snape", text:"波特。你的魔藥在冒黑煙，你的手在抖。\n——明天開始給我去醫療翼躺著。這是命令。"},
      ], next);
    });
  }

  runChain(chain, ()=>{
    S.monthIndex++;
    if(S.monthIndex >= 84){ showEnding(); return; }
    S.money += 40; // 零用錢
    refreshUI();
    save();
    const {year,month:m} = dateOf(S.monthIndex);
    showToast(`${year}年${m}月　零用錢 +40 加隆`);
  });
}
function runChain(fns, done){
  const step = i => (i >= fns.length) ? done() : fns[i](()=>step(i+1));
  step(0);
}

function pickRandomEvent(){
  const pool = RANDOM_EVENTS.filter(e =>
    e.cond() && !(e.once && S.onceEvents.includes(e.id)));
  if(!pool.length) return null;
  const ev = pick(pool);
  if(ev.once) S.onceEvents.push(ev.id);
  return ev.fn.bind(ev);
}

  {who:"snape", text:"這雙眼睛……越來越像她了。\n……沒什麼。茶要涼了，喝。"},
  {who:"snape", text:"哈莉。無論將來你選哪條路——\n……算了。反正無論哪條，我都會替你把後面守好。去吧。"},
];
function talkToSnape(){
  const a = S.stats.snape;
  const line = a>=300 ? pick(TALKS_HIGH) : a>=120 ? pick(TALKS_MID) : pick(TALKS_LOW);
  say([line], ()=>{ applyGains({snape:2, stress:-4}, true); });
}

/* ============================================================
   結局判定
============================================================ */
const ENDINGS = [
  {id:"dark", title:"另一個黑魔王", cond:s=>s.dark>=350,
   desc:"力量的低語終究吞噬了那雙祖母綠的眼睛。哈莉·波特消失在禁忌森林深處，數年後，一個新的名字讓整個魔法界戰慄。而傳聞裡，總有一個黑袍的身影追隨在她左右——他曾發誓要守護莉莉的女兒，無論她走向何方。"},
  {id:"savior", title:"活下來的女孩・救世主", cond:s=>s.courage>=650&&s.magic>=650&&s.dark<200,
   desc:"最終決戰之夜，哈莉·波特站在了黑魔王面前——身後是她的教授，手中是他教會她的每一道咒語。當黎明升起，魔法界迎來了自由。慶功宴上，人們高呼救世主之名，而她穿過人群，把金梅林勳章掛在了那件黑袍的胸前。"},
  {id:"potion", title:"魔藥大師的傳人", cond:s=>s.snape>=380&&s.knowledge>=550,
   desc:"哈莉成為了史上最年輕的魔藥大師，她改良的狼人藥拯救了無數人。授證典禮上，她的導師坐在第一排——那個永遠板著臉的男人，在起立鼓掌時，被清楚地看見眼眶泛紅。「教授，我們的下一個研究是什麼？」「……先把你的實驗台收乾淨，波特大師。」"},
  {id:"auror", title:"傲羅辦公室主任", cond:s=>s.courage>=550&&s.magic>=450&&s.dark<250,
   desc:"正氣凜然的傲羅哈莉·波特，成為了魔法執法部門最年輕的主任。每次出勤前，她都會摸一摸口袋裡那瓶隨身攜帶的急救魔藥——熬製者不肯署名，但每個月都會準時寄到。"},
  {id:"quidditch", title:"魁地奇世界盃冠軍", cond:s=>s.fitness>=600,
   desc:"英格蘭國家隊搜捕手哈莉·波特，在世界盃決賽的暴雨中完成了教科書級的朗斯基詐術。頒獎台上她朝貴賓席揮手——那裡坐著一位全程「碰巧路過」的黑袍教授，膝上放著寫滿她七年來每場比賽數據的筆記本。"},
  {id:"professor", title:"霍格華茲最年輕的教授", cond:s=>s.knowledge>=600&&s.magic>=450,
   desc:"黑魔法防禦術教室迎來了新任教授——哈莉·波特，霍格華茲百年來最年輕的教員。教師休息室裡，魔藥學教授照例毒舌：「你的教案漏洞百出。」但每一頁的空白處，都已經被密密麻麻的手寫建議填滿了。"},
  {id:"minister", title:"魔法部的新星", cond:s=>s.charm>=500&&s.knowledge>=400,
   desc:"優雅、聰慧、無懈可擊——魔法部國際交流司司長哈莉·波特，被《預言家日報》譽為下一任部長的不二人選。每逢重大談判前夜，她總會回蜘蛛尾巷的小屋吃一頓晚餐。「部長閣下也是要人做飯的。」某位教授一邊繫圍裙一邊冷笑。"},
  {id:"happy", title:"平凡而閃閃發光的日子", cond:()=>true,
   desc:"哈莉沒有成為傳說。她在霍格莫德開了一間小小的茶館，賣奶油啤酒和自己烤的獅子座星圖蛋糕。每週五打烊後，總有一位黑袍客人坐在窗邊的老位置。「本店招牌，安神花草茶。」「……比我教你的配方差遠了。」「那您還每週都來？」「…………續杯。」"},
];
function snapeEpilogue(a){
  if(a>=380) return "【監護人・賽佛勒斯：家人】十七年前那個雨夜接過的襁褓，如今已是他不再需要隱藏的驕傲。";
  if(a>=250) return "【監護人・賽佛勒斯：默默守護】他仍然毒舌、仍然板著臉，但哈莉知道，那件黑袍永遠會擋在她身前。";
  if(a>=120) return "【監護人・賽佛勒斯：彆扭的羈絆】師生之間隔著一整個蜘蛛尾巷的沉默，和誰也不肯先說的一句「謝謝」。";
  return "【監護人・賽佛勒斯：疏遠】有些話,他終究沒能說出口。書房裡那張合照,積了薄薄的灰。";
}
function showEnding(){
  const st = {...S.stats};
  const end = ENDINGS.find(e=>e.cond(st));
  showScreen("screen-ending");
  $("end-portrait").innerHTML = hallySVG(3, S.house || "gryffindor");
  $("end-title").textContent = end.title;
  $("end-desc").innerHTML =
    `<p>${end.desc}</p><p style="margin-top:10px;color:var(--ink-soft);">${snapeEpilogue(st.snape)}</p>`;
  const box = $("end-stats");
  box.innerHTML = "";
  STAT_DEFS.forEach(d=>{
    box.insertAdjacentHTML("beforeend",
      `<div class="end-stat">${d.name.replace(/　/g,"")}<b>${st[d.key]}</b></div>`);
  });
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

/* ============================================================
   綁定
============================================================ */
$("btn-new").onclick = startNewGame;
$("btn-continue").onclick = ()=>{
  const d = load();
  if(d){ S = d; refreshUI(); showScreen("screen-main"); showToast("讀取日誌完成"); }
};
$("btn-schedule").onclick = openSchedule;
$("btn-talk").onclick = talkToSnape;
$("btn-save").onclick = ()=>{ save(); showToast("已記錄至羊皮紙日誌"); };
$("btn-sched-clear").onclick = ()=>{ S.schedule = []; renderSchedule(); };
$("btn-sched-back").onclick = ()=>{ showScreen("screen-main"); };
$("btn-sched-go").onclick = runMonth;
$("btn-restart").onclick = ()=>{ showScreen("screen-title"); initTitle(); };

/* ============================================================
   標題畫面星星 + 初始化
============================================================ */
function initTitle(){
  const stars = $("stars");
  stars.innerHTML = "";
  for(let i=0;i<26;i++){
    const s = document.createElement("span");
    s.textContent = pick(["✦","✧","⋆","·"]);
    s.style.left = rnd(2,96)+"%";
    s.style.top = rnd(2,94)+"%";
    s.style.fontSize = rnd(8,18)+"px";
    s.style.animationDelay = (Math.random()*3)+"s";
    stars.appendChild(s);
  }
  $("btn-continue").style.display = load() ? "" : "none";
}
initTitle();
showScreen("screen-title");
</script>
